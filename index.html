<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rick Beato — YouTube Embed</title>
  <style>
    :root { --bg:#0b0b0f; --fg:#eaeaf0; --muted:#9aa0a6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
    .card { width: min(900px, 100%); }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.25rem, 2vw + 1rem, 2rem); }
    p { margin: 0 0 1rem; color: var(--muted); }
    .player { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 16px;
              box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    a { color: #8ab4f8; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Rick Beato — Embedded Video</h1>
      <p>If your browser blocks iframes, <a href="https://www.youtube.com/watch?v=zBq_krhKbW4">open on YouTube</a>.</p>

      <iframe
        class="player"
        src="https://www.youtube.com/embed/zBq_krhKbW4?rel=0"
        title="Rick Beato video"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
  </main>
</body>
</html>
